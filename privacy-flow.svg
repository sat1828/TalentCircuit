<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="privBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080d1a"/>
      <stop offset="100%" style="stop-color:#0d1829"/>
    </linearGradient>
    <linearGradient id="stage1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#0d2444"/>
    </linearGradient>
    <linearGradient id="stage2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0e40"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="stage3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2740"/>
      <stop offset="100%" style="stop-color:#0d3557"/>
    </linearGradient>
    <filter id="privGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowPriv" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff" opacity="0.9"/>
    </marker>
  </defs>

  <rect width="900" height="260" fill="url(#privBg)"/>

  <!-- Title -->
  <text x="450" y="32" font-family="Georgia, serif" font-size="16" fill="#00d4ff" text-anchor="middle" letter-spacing="3">THREE-STAGE PRIVACY SYSTEM</text>
  <line x1="80" y1="42" x2="820" y2="42" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Stage 1: Anonymous Interest -->
  <rect x="40" y="60" width="240" height="160" rx="14" fill="url(#stage1Grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Eye with slash icon area -->
  <g transform="translate(130, 95)">
    <!-- Eye shape -->
    <ellipse cx="30" cy="14" rx="22" ry="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <!-- Diagonal slash -->
    <line x1="10" y1="0" x2="50" y2="28" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <circle cx="30" cy="14" r="6" fill="#38bdf8" opacity="0.2"/>
  </g>
  <text x="160" y="130" font-family="Georgia, serif" font-size="14" fill="#38bdf8" text-anchor="middle" font-weight="600">Stage 1</text>
  <text x="160" y="148" font-family="monospace" font-size="12" fill="#7dd3fc" text-anchor="middle">Anonymous Interest</text>
  <text x="160" y="168" font-family="monospace" font-size="10" fill="#4a90d9" text-anchor="middle">Employee clicks "Interested"</text>
  <text x="160" y="185" font-family="monospace" font-size="10" fill="#4a90d9" text-anchor="middle">Manager sees count only</text>
  <text x="160" y="200" font-family="monospace" font-size="10" fill="#4a90d9" text-anchor="middle">Identity fully hidden</text>

  <!-- Arrow 1 → 2 -->
  <g>
    <line x1="290" y1="140" x2="340" y2="140" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowPriv)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- Moving dot on arrow -->
    <circle r="4" fill="#00d4ff" filter="url(#privGlow)">
      <animateMotion dur="2s" repeatCount="indefinite">
        <mpath href="#privPath1"/>
      </animateMotion>
    </circle>
    <path id="privPath1" d="M290,140 L340,140" fill="none"/>
    <text x="315" y="128" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">Apply</text>
  </g>

  <!-- Stage 2: Visible Application -->
  <rect x="340" y="60" width="220" height="160" rx="14" fill="url(#stage2Grad)" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.7"/>
  <g transform="translate(430, 85)">
    <!-- Person icon -->
    <circle cx="20" cy="12" r="10" fill="#a78bfa" opacity="0.3"/>
    <circle cx="20" cy="12" r="6" fill="#a78bfa" opacity="0.6"/>
    <!-- Visible tick -->
    <path d="M8,28 Q20,22 32,28" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
    <!-- Eye (open) -->
    <ellipse cx="20" cy="38" rx="12" ry="8" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
    <circle cx="20" cy="38" r="4" fill="#a78bfa" opacity="0.4"/>
  </g>
  <text x="450" y="140" font-family="Georgia, serif" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="600">Stage 2</text>
  <text x="450" y="158" font-family="monospace" font-size="12" fill="#c4b5fd" text-anchor="middle">Visible Application</text>
  <text x="450" y="178" font-family="monospace" font-size="10" fill="#9061f9" text-anchor="middle">Name visible to hiring mgr</text>
  <text x="450" y="195" font-family="monospace" font-size="10" fill="#9061f9" text-anchor="middle">Current mgr still blind</text>

  <!-- Arrow 2 → 3 -->
  <g>
    <line x1="570" y1="140" x2="620" y2="140" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowPriv)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <circle r="4" fill="#00d4ff" filter="url(#privGlow)">
      <animateMotion dur="2.5s" repeatCount="indefinite" begin="0.5s">
        <mpath href="#privPath2"/>
      </animateMotion>
    </circle>
    <path id="privPath2" d="M570,140 L620,140" fill="none"/>
    <text x="595" y="128" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">Interview</text>
  </g>

  <!-- Stage 3: Full Visibility -->
  <rect x="620" y="60" width="240" height="160" rx="14" fill="url(#stage3Grad)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.7"/>
  <g transform="translate(710, 85)">
    <!-- Bell icon -->
    <path d="M30,8 Q30,0 20,0 Q10,0 10,8 L8,30 L32,30 Z" fill="#22c55e" opacity="0.25"/>
    <path d="M30,8 Q30,0 20,0 Q10,0 10,8 L8,30 L32,30 Z" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
    <line x1="14" y1="30" x2="26" y2="30" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
    <!-- Dot at top for notification -->
    <circle cx="30" cy="4" r="5" fill="#22c55e" opacity="0.8" filter="url(#privGlow)">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="740" y="140" font-family="Georgia, serif" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="600">Stage 3</text>
  <text x="740" y="158" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">Manager Notified</text>
  <text x="740" y="178" font-family="monospace" font-size="10" fill="#16a34a" text-anchor="middle">Current manager alerted</text>
  <text x="740" y="195" font-family="monospace" font-size="10" fill="#16a34a" text-anchor="middle">Full transparency, post-interview</text>
  <text x="740" y="212" font-family="monospace" font-size="10" fill="#16a34a" text-anchor="middle">Socket.io notification</text>

  <!-- Bottom label -->
  <text x="450" y="245" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">Employee controls their own visibility. Privacy by design, not by policy.</text>
</svg>
