<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07091a"/>
      <stop offset="100%" style="stop-color:#0d1020"/>
    </linearGradient>
    <linearGradient id="vecGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0080b3;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="vecGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowVec" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff" opacity="0.8"/>
    </marker>
  </defs>

  <rect width="960" height="300" fill="url(#vBg)"/>

  <!-- Title -->
  <text x="480" y="30" font-family="Georgia, serif" font-size="16" fill="#00d4ff" text-anchor="middle" letter-spacing="3">pgVECTOR SEMANTIC SKILL MATCHING</text>
  <line x1="80" y1="40" x2="880" y2="40" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Step 1: Employee Profile -->
  <rect x="30" y="55" width="200" height="210" rx="10" fill="#080f1e" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="130" y="78" font-family="Georgia, serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="600">Employee Profile</text>
  <line x1="45" y1="85" x2="215" y2="85" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Skill bars animated -->
  <text x="45" y="104" font-family="monospace" font-size="9" fill="#4a90d9">React</text>
  <rect x="45" y="108" width="100" height="8" rx="3" fill="#0a1e40"/>
  <rect x="45" y="108" width="90" height="8" rx="3" fill="#00d4ff" opacity="0.8">
    <animate attributeName="width" values="0;90" dur="1.5s" fill="freeze"/>
  </rect>
  <text x="150" y="116" font-family="monospace" font-size="9" fill="#38bdf8">×1.3 ✓</text>

  <text x="45" y="130" font-family="monospace" font-size="9" fill="#4a90d9">TypeScript</text>
  <rect x="45" y="134" width="100" height="8" rx="3" fill="#0a1e40"/>
  <rect x="45" y="134" width="80" height="8" rx="3" fill="#00d4ff" opacity="0.7">
    <animate attributeName="width" values="0;80" dur="1.8s" fill="freeze"/>
  </rect>
  <text x="150" y="142" font-family="monospace" font-size="9" fill="#38bdf8">×1.0</text>

  <text x="45" y="156" font-family="monospace" font-size="9" fill="#4a90d9">Node.js</text>
  <rect x="45" y="160" width="100" height="8" rx="3" fill="#0a1e40"/>
  <rect x="45" y="160" width="65" height="8" rx="3" fill="#00d4ff" opacity="0.6">
    <animate attributeName="width" values="0;65" dur="2s" fill="freeze"/>
  </rect>
  <text x="150" y="168" font-family="monospace" font-size="9" fill="#38bdf8">×1.3 ✓</text>

  <text x="45" y="182" font-family="monospace" font-size="9" fill="#4a90d9">PostgreSQL</text>
  <rect x="45" y="186" width="100" height="8" rx="3" fill="#0a1e40"/>
  <rect x="45" y="186" width="50" height="8" rx="3" fill="#00d4ff" opacity="0.5">
    <animate attributeName="width" values="0;50" dur="2.2s" fill="freeze"/>
  </rect>
  <text x="150" y="194" font-family="monospace" font-size="9" fill="#38bdf8">×1.0</text>

  <text x="45" y="220" font-family="monospace" font-size="9" fill="#7dd3fc">Proficiency × Validation</text>
  <text x="45" y="236" font-family="monospace" font-size="9" fill="#4a90d9">weight → vector(1536)</text>
  <text x="45" y="252" font-family="monospace" font-size="9" fill="#4a90d9">via OpenAI embeddings</text>

  <!-- Arrow 1 -->
  <line x1="235" y1="160" x2="285" y2="160" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowVec)"/>
  <text x="260" y="150" font-family="monospace" font-size="8" fill="#4a5568" text-anchor="middle">embed</text>

  <!-- Step 2: Vector Space -->
  <rect x="285" y="55" width="220" height="210" rx="10" fill="#080f1e" stroke="#7b2fff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="395" y="78" font-family="Georgia, serif" font-size="12" fill="#c4b5fd" text-anchor="middle" font-weight="600">Vector Space</text>
  <line x1="300" y1="85" x2="490" y2="85" stroke="#7b2fff" stroke-width="0.5" opacity="0.3"/>

  <!-- Coordinate system visualization -->
  <line x1="320" y1="230" x2="490" y2="230" stroke="#4a5568" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="230" x2="320" y2="100" stroke="#4a5568" stroke-width="1" opacity="0.5"/>
  <text x="492" y="233" font-family="monospace" font-size="8" fill="#4a5568">dim₁</text>
  <text x="308" y="97" font-family="monospace" font-size="8" fill="#4a5568">dim₂</text>

  <!-- Employee vector -->
  <line x1="320" y1="230" x2="440" y2="130" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <circle cx="440" cy="130" r="7" fill="#00d4ff" opacity="0.9" filter="url(#vecGlow)">
    <animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="126" font-family="monospace" font-size="9" fill="#38bdf8">Employee</text>

  <!-- Job vector -->
  <line x1="320" y1="230" x2="420" y2="115" stroke="#22c55e" stroke-width="2" opacity="0.8"/>
  <circle cx="420" cy="115" r="7" fill="#22c55e" opacity="0.9" filter="url(#vecGlow)">
    <animate attributeName="r" values="7;9;7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="430" y="110" font-family="monospace" font-size="9" fill="#4ade80">Job Req</text>

  <!-- Angle arc for cosine similarity -->
  <path d="M370,195 Q385,178 375,163" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
  <text x="383" y="182" font-family="monospace" font-size="9" fill="#fbbf24">θ</text>
  <text x="295" y="250" font-family="monospace" font-size="9" fill="#9061f9">cos(θ) = score</text>

  <!-- Score indicator -->
  <rect x="300" y="255" width="190" height="2" rx="1" fill="#0a1e40"/>
  <rect x="300" y="255" width="162" height="2" rx="1" fill="#22c55e" opacity="0.8">
    <animate attributeName="width" values="0;162" dur="2s" fill="freeze"/>
  </rect>
  <text x="466" y="263" font-family="monospace" font-size="9" fill="#4ade80">0.85</text>

  <!-- Arrow 2 -->
  <line x1="510" y1="160" x2="555" y2="160" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowVec)"/>
  <text x="532" y="150" font-family="monospace" font-size="8" fill="#4a5568" text-anchor="middle">rank</text>

  <!-- Step 3: Ranked Results -->
  <rect x="555" y="55" width="210" height="210" rx="10" fill="#080f1e" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="660" y="78" font-family="Georgia, serif" font-size="12" fill="#4ade80" text-anchor="middle" font-weight="600">Match Rankings</text>
  <line x1="570" y1="85" x2="750" y2="85" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>

  <!-- Ranked items -->
  <rect x="575" y="95" width="175" height="30" rx="6" fill="#0a2010" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="585" y="114" font-family="monospace" font-size="11" fill="#4ade80">98% Alex Chen</text>
  <rect x="735" y="97" width="10" height="26" rx="2" fill="#22c55e" opacity="0.8"/>

  <rect x="575" y="133" width="175" height="30" rx="6" fill="#081a0a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="585" y="152" font-family="monospace" font-size="11" fill="#86efac">92% Jordan Kim</text>
  <rect x="735" y="135" width="9" height="26" rx="2" fill="#22c55e" opacity="0.65"/>

  <rect x="575" y="171" width="175" height="30" rx="6" fill="#071510" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="585" y="190" font-family="monospace" font-size="11" fill="#86efac">87% Sam Rivera</text>
  <rect x="735" y="173" width="8" height="26" rx="2" fill="#22c55e" opacity="0.5"/>

  <rect x="575" y="209" width="175" height="30" rx="6" fill="#060f08" stroke="#22c55e" stroke-width="1" stroke-opacity="0.2"/>
  <text x="585" y="228" font-family="monospace" font-size="11" fill="#4a7a50">75% Taylor Lee</text>
  <rect x="735" y="211" width="6" height="26" rx="2" fill="#22c55e" opacity="0.35"/>

  <text x="660" y="256" font-family="monospace" font-size="9" fill="#4a7a50" text-anchor="middle">Hidden Talent surface included</text>

  <!-- Arrow 3 -->
  <line x1="770" y1="160" x2="815" y2="160" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowVec)"/>
  <text x="792" y="150" font-family="monospace" font-size="8" fill="#4a5568" text-anchor="middle">analyze</text>

  <!-- Step 4: Gap Analysis -->
  <rect x="815" y="55" width="120" height="210" rx="10" fill="#080f1a" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="875" y="78" font-family="Georgia, serif" font-size="11" fill="#e879f9" text-anchor="middle" font-weight="600">AI Gap</text>
  <text x="875" y="92" font-family="Georgia, serif" font-size="11" fill="#e879f9" text-anchor="middle" font-weight="600">Analysis</text>
  <line x1="825" y1="99" x2="925" y2="99" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>
  <text x="875" y="125" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">Claude</text>
  <text x="875" y="140" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">Sonnet 4</text>

  <!-- Pulsing brain icon area -->
  <circle cx="875" cy="175" r="25" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4">
    <animate attributeName="r" values="22;28;22" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="875" y="178" font-family="monospace" font-size="18" text-anchor="middle" fill="#a855f7">✦</text>

  <text x="875" y="215" font-family="monospace" font-size="8" fill="#9061f9" text-anchor="middle">Learning</text>
  <text x="875" y="228" font-family="monospace" font-size="8" fill="#9061f9" text-anchor="middle">plan</text>
  <text x="875" y="241" font-family="monospace" font-size="8" fill="#9061f9" text-anchor="middle">generated</text>
</svg>
