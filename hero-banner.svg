<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" style="font-family:'Georgia',serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0d1929"/>
      <stop offset="100%" style="stop-color:#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2fff"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0080b3;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="nodeGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>
    <mask id="fade">
      <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:white;stop-opacity:0"/>
        <stop offset="15%" style="stop-color:white;stop-opacity:1"/>
        <stop offset="85%" style="stop-color:white;stop-opacity:1"/>
        <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
      </linearGradient>
      <rect width="1200" height="400" fill="url(#fadeMask)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.07" mask="url(#fade)">
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Network graph - right side nodes and connections -->
  <g opacity="0.6" mask="url(#fade)">
    <!-- connection lines -->
    <line x1="900" y1="200" x2="980" y2="130" stroke="#00d4ff" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="200" x2="1020" y2="250" stroke="#00d4ff" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="200" x2="850" y2="120" stroke="#7b2fff" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="200" x2="830" y2="300" stroke="#7b2fff" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="980" y1="130" x2="1020" y2="250" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
    <line x1="850" y1="120" x2="980" y2="130" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
    <line x1="830" y1="300" x2="1020" y2="250" stroke="#7b2fff" stroke-width="0.5" opacity="0.2"/>
    <line x1="1020" y1="250" x2="1080" y2="180" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
    <line x1="1080" y1="180" x2="1100" y2="100" stroke="#7b2fff" stroke-width="0.5" opacity="0.15"/>
    <line x1="1080" y1="180" x2="1150" y2="250" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>

    <!-- Outer nodes -->
    <circle cx="980" cy="130" r="6" fill="#00d4ff" opacity="0.8" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="250" r="5" fill="#7b2fff" opacity="0.8" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="120" r="7" fill="#00d4ff" opacity="0.7" filter="url(#glow)">
      <animate attributeName="r" values="7;9;7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="300" r="5" fill="#7b2fff" opacity="0.8" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="180" r="6" fill="#00d4ff" opacity="0.6" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="100" r="4" fill="#7b2fff" opacity="0.5"/>
    <circle cx="1150" cy="250" r="4" fill="#00d4ff" opacity="0.5"/>
    <circle cx="760" cy="180" r="4" fill="#00d4ff" opacity="0.4"/>
    <circle cx="790" cy="330" r="3" fill="#7b2fff" opacity="0.4"/>

    <!-- Center hub node -->
    <circle cx="900" cy="200" r="20" fill="url(#centerGlow)" filter="url(#softGlow)">
      <animate attributeName="r" values="20;25;20" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="200" r="12" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
    <circle cx="900" cy="200" r="6" fill="white" opacity="0.9"/>

    <!-- Pulsing ring on center -->
    <circle cx="900" cy="200" r="18" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0">
      <animate attributeName="r" values="12;35;12" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Moving data particle on line -->
  <circle r="3" fill="#00d4ff" filter="url(#glow)" opacity="0.9">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#path1"/>
    </animateMotion>
  </circle>
  <path id="path1" d="M900,200 L980,130" fill="none"/>

  <circle r="3" fill="#7b2fff" filter="url(#glow)" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite" begin="1s">
      <mpath href="#path2"/>
    </animateMotion>
  </circle>
  <path id="path2" d="M900,200 L830,300" fill="none"/>

  <!-- Left side - text content -->
  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <circle cx="16" cy="16" r="16" fill="#00d4ff" opacity="0.15"/>
    <circle cx="16" cy="16" r="8" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
    <circle cx="16" cy="16" r="4" fill="white"/>
    <!-- orbit lines -->
    <ellipse cx="16" cy="16" rx="16" ry="7" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5" transform="rotate(-20, 16, 16)"/>
  </g>

  <!-- Main title -->
  <text x="120" y="108" font-family="Georgia, serif" font-size="15" fill="#00d4ff" letter-spacing="6" opacity="0.8">INTERNAL TALENT MARKETPLACE</text>

  <text x="78" y="175" font-family="Georgia, serif" font-size="72" font-weight="700" fill="white" letter-spacing="-2">Talent</text>
  <text x="78" y="260" font-family="Georgia, serif" font-size="72" font-weight="700" fill="url(#accentGrad)" letter-spacing="-2">Circuit</text>

  <!-- Accent underline -->
  <rect x="78" y="272" width="380" height="3" fill="url(#accentGrad)" rx="2">
    <animate attributeName="width" values="0;380" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- Tagline -->
  <text x="80" y="320" font-family="Georgia, serif" font-size="18" fill="#8ba3c7" letter-spacing="1">AI-powered skill matching · pgvector search · Real-time notifications</text>

  <!-- Tech badges -->
  <g transform="translate(80, 345)">
    <!-- TypeScript -->
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#00d4ff" opacity="0.12" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="45" y="17" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle">TypeScript</text>

    <!-- React -->
    <rect x="98" y="0" width="65" height="26" rx="13" fill="#00d4ff" opacity="0.12" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="130" y="17" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle">React</text>

    <!-- pgvector -->
    <rect x="171" y="0" width="78" height="26" rx="13" fill="#7b2fff" opacity="0.15" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="210" y="17" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle">pgvector</text>

    <!-- Claude AI -->
    <rect x="257" y="0" width="75" height="26" rx="13" fill="#7b2fff" opacity="0.15" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="294" y="17" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle">Claude AI</text>

    <!-- Docker -->
    <rect x="340" y="0" width="62" height="26" rx="13" fill="#00d4ff" opacity="0.12" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="371" y="17" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle">Docker</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
