<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080d1a"/>
      <stop offset="100%" style="stop-color:#0d1829"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d1b69;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2740;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d3557;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a4800;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowArch">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff" opacity="0.8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7b2fff" opacity="0.8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e" opacity="0.8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b" opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="url(#bgArch)"/>

  <!-- Title -->
  <text x="550" y="40" font-family="Georgia, serif" font-size="20" fill="#00d4ff" text-anchor="middle" letter-spacing="4">SYSTEM ARCHITECTURE</text>
  <line x1="200" y1="50" x2="900" y2="50" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

  <!-- ─────────────── LAYER LABELS ─────────────── -->
  <text x="30" y="130" font-family="monospace" font-size="10" fill="#4a5568" letter-spacing="2">FRONTEND</text>
  <text x="30" y="260" font-family="monospace" font-size="10" fill="#4a5568" letter-spacing="2">BACKEND</text>
  <text x="30" y="420" font-family="monospace" font-size="10" fill="#4a5568" letter-spacing="2">DATA</text>
  <text x="30" y="540" font-family="monospace" font-size="10" fill="#4a5568" letter-spacing="2">EXTERNAL</text>

  <!-- ─────────────── WEB APP BOX ─────────────── -->
  <rect x="120" y="80" width="820" height="120" rx="12" fill="url(#webGrad)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="160" y="108" font-family="Georgia, serif" font-size="14" fill="#00d4ff" font-weight="600">apps/web — React + Vite</text>

  <!-- Web sub-components -->
  <rect x="145" y="118" width="140" height="60" rx="8" fill="#00d4ff" fill-opacity="0.08" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="215" y="142" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">Job Board</text>
  <text x="215" y="158" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">+ Match Scores</text>
  <text x="215" y="170" font-family="monospace" font-size="9" fill="#4a90d9" text-anchor="middle">Recharts</text>

  <rect x="303" y="118" width="140" height="60" rx="8" fill="#00d4ff" fill-opacity="0.08" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="373" y="142" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">Career Path</text>
  <text x="373" y="158" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">Visualizer</text>
  <text x="373" y="170" font-family="monospace" font-size="9" fill="#4a90d9" text-anchor="middle">D3.js Solar System</text>

  <rect x="461" y="118" width="140" height="60" rx="8" fill="#00d4ff" fill-opacity="0.08" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="531" y="142" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">Profile + Skills</text>
  <text x="531" y="158" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">Manager View</text>
  <text x="531" y="170" font-family="monospace" font-size="9" fill="#4a90d9" text-anchor="middle">Tailwind CSS</text>

  <rect x="619" y="118" width="140" height="60" rx="8" fill="#7b2fff" fill-opacity="0.1" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="689" y="142" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">AI Gap Analysis</text>
  <text x="689" y="158" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">UI Panel</text>
  <text x="689" y="170" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Claude streaming</text>

  <rect x="777" y="118" width="140" height="60" rx="8" fill="#00d4ff" fill-opacity="0.08" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="847" y="142" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">Notifications</text>
  <text x="847" y="158" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">+ Admin Dashboard</text>
  <text x="847" y="170" font-family="monospace" font-size="9" fill="#4a90d9" text-anchor="middle">Socket.io client</text>

  <!-- ─────────────── API LAYER CONNECTOR ─────────────── -->
  <!-- HTTP arrows going down -->
  <line x1="215" y1="200" x2="215" y2="215" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="373" y1="200" x2="373" y2="215" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="531" y1="200" x2="531" y2="215" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="689" y1="200" x2="689" y2="215" stroke="#7b2fff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="847" y1="200" x2="847" y2="215" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- REST label -->
  <text x="310" y="210" font-family="monospace" font-size="9" fill="#4a5568">REST / JWT</text>
  <text x="750" y="210" font-family="monospace" font-size="9" fill="#4a5568">WebSocket</text>

  <!-- ─────────────── API BOX ─────────────── -->
  <rect x="120" y="215" width="820" height="140" rx="12" fill="url(#apiGrad)" stroke="#7b2fff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="160" y="243" font-family="Georgia, serif" font-size="14" fill="#a78bfa" font-weight="600">apps/api — Express + TypeScript</text>

  <!-- Router / middleware -->
  <rect x="145" y="253" width="110" height="80" rx="8" fill="#7b2fff" fill-opacity="0.12" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="200" y="277" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Auth Router</text>
  <text x="200" y="293" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">JWT Middleware</text>
  <text x="200" y="309" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">RBAC Guards</text>
  <text x="200" y="323" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Refresh Rotation</text>

  <rect x="270" y="253" width="110" height="80" rx="8" fill="#7b2fff" fill-opacity="0.12" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="325" y="277" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Jobs Router</text>
  <text x="325" y="293" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Match Score Engine</text>
  <text x="325" y="309" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Privacy Stages</text>
  <text x="325" y="323" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Hidden Talent</text>

  <rect x="395" y="253" width="110" height="80" rx="8" fill="#7b2fff" fill-opacity="0.12" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="450" y="277" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Profile Router</text>
  <text x="450" y="293" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Skills CRUD</text>
  <text x="450" y="309" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Skill Validation</text>
  <text x="450" y="323" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Career Aspirations</text>

  <rect x="520" y="253" width="110" height="80" rx="8" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
  <text x="575" y="277" font-family="monospace" font-size="10" fill="#e879f9" text-anchor="middle">AI Router</text>
  <text x="575" y="293" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">Gap Analysis</text>
  <text x="575" y="309" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">Career Path</text>
  <text x="575" y="323" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">packages/ai</text>

  <rect x="645" y="253" width="110" height="80" rx="8" fill="#7b2fff" fill-opacity="0.12" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="277" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Notifications</text>
  <text x="700" y="293" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Socket.io Server</text>
  <text x="700" y="309" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Redis Pub/Sub</text>
  <text x="700" y="323" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Cross-process</text>

  <rect x="770" y="253" width="150" height="80" rx="8" fill="#7b2fff" fill-opacity="0.12" stroke="#7b2fff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="845" y="277" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">BullMQ Workers</text>
  <text x="845" y="293" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Weekly Digest</text>
  <text x="845" y="309" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Embedding Seeder</text>
  <text x="845" y="323" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Admin Triggers</text>

  <!-- ─────────────── DATA LAYER ARROWS ─────────────── -->
  <line x1="300" y1="355" x2="300" y2="370" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.7"/>
  <line x1="550" y1="355" x2="550" y2="370" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.7"/>
  <line x1="700" y1="355" x2="700" y2="370" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)" opacity="0.7"/>
  <line x1="845" y1="355" x2="845" y2="370" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)" opacity="0.7"/>

  <!-- ─────────────── DATA LAYER ─────────────── -->
  <!-- PostgreSQL -->
  <rect x="120" y="370" width="300" height="110" rx="12" fill="url(#dbGrad)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="270" y="396" font-family="Georgia, serif" font-size="13" fill="#38bdf8" text-anchor="middle" font-weight="600">PostgreSQL 16 + pgvector</text>
  <text x="145" y="418" font-family="monospace" font-size="10" fill="#7dd3fc">→ 14 tables, 12 ENUMs</text>
  <text x="145" y="435" font-family="monospace" font-size="10" fill="#7dd3fc">→ 1536-dim ivfflat index</text>
  <text x="145" y="452" font-family="monospace" font-size="10" fill="#7dd3fc">→ Cosine similarity search</text>
  <text x="145" y="469" font-family="monospace" font-size="10" fill="#7dd3fc">→ Weighted skill vectors</text>

  <!-- Redis -->
  <rect x="440" y="370" width="220" height="110" rx="12" fill="#1a0e00" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="550" y="396" font-family="Georgia, serif" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="600">Redis</text>
  <text x="460" y="418" font-family="monospace" font-size="10" fill="#fde68a">→ BullMQ job queues</text>
  <text x="460" y="435" font-family="monospace" font-size="10" fill="#fde68a">→ Socket.io Pub/Sub</text>
  <text x="460" y="452" font-family="monospace" font-size="10" fill="#fde68a">→ Cross-process events</text>
  <text x="460" y="469" font-family="monospace" font-size="10" fill="#fde68a">→ Session caching</text>

  <!-- Docker infra badge -->
  <rect x="680" y="370" width="260" height="110" rx="12" fill="#0a1810" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="810" y="396" font-family="Georgia, serif" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="600">Docker Compose</text>
  <text x="700" y="418" font-family="monospace" font-size="10" fill="#86efac">→ Multi-stage builds</text>
  <text x="700" y="435" font-family="monospace" font-size="10" fill="#86efac">→ Dev + Prod configs</text>
  <text x="700" y="452" font-family="monospace" font-size="10" fill="#86efac">→ Nginx reverse proxy</text>
  <text x="700" y="469" font-family="monospace" font-size="10" fill="#86efac">→ Health checks</text>

  <!-- ─────────────── EXTERNAL SERVICES ─────────────── -->
  <!-- Arrows down to external -->
  <line x1="575" y1="355" x2="200" y2="518" stroke="#a855f7" stroke-width="1" stroke-dasharray="5,3" opacity="0.5" marker-end="url(#arrowPurple)"/>
  <line x1="575" y1="355" x2="430" y2="518" stroke="#22c55e" stroke-width="1" stroke-dasharray="5,3" opacity="0.5" marker-end="url(#arrowGreen)"/>
  <line x1="845" y1="480" x2="660" y2="518" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3" opacity="0.5" marker-end="url(#arrowOrange)"/>

  <!-- External boxes -->
  <rect x="120" y="520" width="160" height="70" rx="10" fill="#1a0533" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
  <text x="200" y="547" font-family="Georgia, serif" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="600">Claude API</text>
  <text x="200" y="565" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">claude-sonnet-4</text>
  <text x="200" y="580" font-family="monospace" font-size="9" fill="#9061f9" text-anchor="middle">Skill gap analysis</text>

  <rect x="300" y="520" width="170" height="70" rx="10" fill="#0a1a10" stroke="#22c55e" stroke-width="1" stroke-opacity="0.6"/>
  <text x="385" y="547" font-family="Georgia, serif" font-size="12" fill="#4ade80" text-anchor="middle" font-weight="600">OpenAI API</text>
  <text x="385" y="565" font-family="monospace" font-size="9" fill="#86efac" text-anchor="middle">text-embedding-3-small</text>
  <text x="385" y="580" font-family="monospace" font-size="9" fill="#86efac" text-anchor="middle">Skill embeddings</text>

  <rect x="490" y="520" width="170" height="70" rx="10" fill="#1a1000" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
  <text x="575" y="547" font-family="Georgia, serif" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="600">SendGrid SMTP</text>
  <text x="575" y="565" font-family="monospace" font-size="9" fill="#fde68a" text-anchor="middle">Weekly digest emails</text>
  <text x="575" y="580" font-family="monospace" font-size="9" fill="#fde68a" text-anchor="middle">Nodemailer + BullMQ</text>

  <!-- shared-types label -->
  <rect x="700" y="520" width="380" height="70" rx="10" fill="#101010" stroke="#4a5568" stroke-width="1" stroke-opacity="0.5"/>
  <text x="890" y="547" font-family="Georgia, serif" font-size="12" fill="#9ca3af" text-anchor="middle" font-weight="600">packages/shared-types + packages/ai</text>
  <text x="890" y="565" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">TypeScript interfaces shared across API + Web</text>
  <text x="890" y="580" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Claude integration · Local cosine matching fallback</text>

  <!-- Animated data flow particle on postgres line -->
  <circle r="4" fill="#00d4ff" filter="url(#glowArch)" opacity="0">
    <animateMotion dur="2s" repeatCount="indefinite">
      <mpath href="#flowPath1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path id="flowPath1" d="M300,355 L300,370" fill="none"/>

  <!-- Bottom accent -->
  <rect x="0" y="616" width="1100" height="4" fill="url(#accentGrad2)"/>
  <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#00d4ff"/>
    <stop offset="100%" style="stop-color:#7b2fff"/>
  </linearGradient>
</svg>
