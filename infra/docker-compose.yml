version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tc-postgres
    environment:
      POSTGRES_DB: talentcircuit
      POSTGRES_USER: talentcircuit
      POSTGRES_PASSWORD: talentcircuit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentcircuit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
